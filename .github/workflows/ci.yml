name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - name: Install and verify Linux isolation dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-pid --die-with-parent --ro-bind / / --proc /proc --dev-bind /dev /dev -- true
      - name: Verify source provenance
        run: bun run verify:provenance
      - name: Verify public Preview projection
        run: bun run verify:public-export && bun run verify:preview-profile
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: Build
        run: bun run build
